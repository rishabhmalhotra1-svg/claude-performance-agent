name: EOD Reminders

on:
  schedule:
    - cron: '30 14 * * 1-6'
    - cron: '0 15 * * 1-6'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: EOD Reminder 1 (8:00 PM IST)
        if: github.event.schedule == '30 14 * * 1-6'
        run: node src/index.js --slack eod-reminder-1
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      - name: EOD Reminder 2 (8:30 PM IST)
        if: github.event.schedule == '0 15 * * 1-6'
        run: node src/index.js --slack eod-reminder-2
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
