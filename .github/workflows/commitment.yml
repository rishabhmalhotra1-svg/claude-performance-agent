name: Day Plan – Commitment & KAM Performance

on:
  schedule:
    - cron: '0 6 * * 1-6'   # 11:30 AM IST (Mon–Sat)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Send KAM Performance (CSV) + Commitment message
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          node src/index.js --slack kam
          node src/index.js --slack commitment

      - name: Persist reminder state
        run: |
          git config user.name "Day Plan Agent"
          git config user.email "dayplan@github-actions"
          git add logs/reminder-state.json data/
          git diff --staged --quiet || git commit -m "chore: state update – commitment [skip ci]"
          git push
