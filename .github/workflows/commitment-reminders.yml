name: Commitment Reminders

on:
  schedule:
    - cron: '0 6 * * 1-6'
    - cron: '30 6 * * 1-6'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Reminder 1 (11:30 AM IST)
        if: github.event.schedule == '0 6 * * 1-6'
        run: node src/index.js --slack reminder-1
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      - name: Reminder 2 (12:00 PM IST)
        if: github.event.schedule == '30 6 * * 1-6'
        run: node src/index.js --slack reminder-2
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
