name: Day Plan – EOD

on:
  schedule:
    - cron: '0 14 * * 1-6'  # 7:30 PM IST (Mon–Sat)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Send EOD message
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: node src/index.js --slack eod

      - name: Persist reminder state
        run: |
          git config user.name "Day Plan Agent"
          git config user.email "dayplan@github-actions"
          git add logs/reminder-state.json
          git diff --staged --quiet || git commit -m "chore: state update – eod [skip ci]"
          git push
